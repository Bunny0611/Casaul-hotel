services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casaul_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: casaul_hotel
      DB_USERNAME: casaul
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: log
    depends_on:
      - mysql
      - redis
    volumes:
      - .:/var/www/html
    command: >
      sh -c "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.0
    container_name: casaul_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: casaul_hotel
      MYSQL_USER: casaul
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: casaul_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
